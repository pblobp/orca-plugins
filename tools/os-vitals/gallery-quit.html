<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OS Vitals quit gallery</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        display: grid;
        grid-template-columns: repeat(4, 360px);
        gap: 16px;
        background: #6b6b73;
        font:
          12px system-ui,
          sans-serif;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-bottom: 4px;
        color: #ffffff;
      }
      iframe {
        display: block;
        border: 0;
      }
    </style>
  </head>
  <body>
    <figure>
      <figcaption>Details with Quit, dark</figcaption>
      <iframe
        title="Details with Quit dark"
        src="harness.html?theme=dark&view=processes&act=select:node"
        width="360"
        height="720"
      ></iframe>
    </figure>
    <figure>
      <figcaption>Confirmation, dark</figcaption>
      <iframe
        title="Confirmation dark"
        src="harness.html?theme=dark&view=processes&act=select:node,click:Quit…"
        width="360"
        height="720"
      ></iframe>
    </figure>
    <figure>
      <figcaption>Asked to quit, dark</figcaption>
      <iframe
        title="Asked to quit dark"
        src="harness.html?theme=dark&view=processes&act=select:vite,wait:10500,click:Quit…,click:Quit"
        width="360"
        height="720"
      ></iframe>
    </figure>
    <figure>
      <figcaption>Still running: force offered, dark</figcaption>
